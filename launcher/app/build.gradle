plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muzdai.launcher'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist (-PlauncherApplicationId=...).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.muzdai.launcher')
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName '1.6.11'
    }

    // Release signing from the environment (GitHub Actions secrets); without it the debug key signs, for local builds.
    signingConfigs {
        release {
            def ks = System.getenv('SIGNING_STORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('SIGNING_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for the voice AI answer tests: android.jar only has stubs of it.
    testImplementation 'org.json:json:20240303'
}
